spring:
  application:
    name: java-learn-app

  # ---- MySQL（M3 正式接入；M1 仅用于验证连接） ----
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ---- Redis ----
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      database: 0

  # ---- RabbitMQ ----
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8080

logging:
  level:
    com.example.ecommerce: DEBUG
