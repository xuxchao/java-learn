spring:
  application:
    name: java-learn-app

  # ---- MySQL（M3 正式接入；M1 仅用于验证连接；M2 用 schema.sql 建 users 表） ----
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ---- Redis ----
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      database: 0

  # ---- RabbitMQ ----
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # ---- SQL 初始化：每次启动用 classpath:schema.sql 幂等建表（M2 的 users 表 + M3 的 products/stock/orders） ----
  sql:
    init:
      mode: always

# ---- MyBatis-Plus（M3）：主键自增、下划线转驼峰、SQL 日志便于观察 EXPLAIN 验证 ----
mybatis-plus:
  global-config:
    db-config:
      id-type: auto            # 配合 MySQL AUTO_INCREMENT
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ---- JWT（M2 鉴权）自定义配置 ----
# 生产环境务必改为随机长密钥并通过环境变量注入，不要硬编码在仓库里
jwt:
  secret: "java-learn-m2-secret-key-change-me-0123456789abcdefghijklmnopqrstuvwxyz"
  expiration-ms: 3600000   # Token 有效期：1 小时

server:
  port: 8080

logging:
  level:
    com.example.ecommerce: DEBUG
